name: procon_app_flutter
description: A simple private voice note app (Flutter MVP)
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  speech_to_text: ^7.4.0
  sembast: ^3.8.9+1
  sembast_web: ^2.4.5+1
  path_provider: ^2.0.15
  path: ^1.8.2
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
