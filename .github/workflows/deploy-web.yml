name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter test

      # base-href matches this repo's name so the app works both at this
      # repo's own project-pages URL (curatedcontent.github.io/ProConApp/)
      # and at the same subpath in the catalogentry-hub site
      # (www.catalogentry.com/ProConApp/).
      #
      # NOTE: do NOT add --no-web-resources-cdn here. It causes a blank
      # white screen at runtime (confirmed via headless browser testing)
      # once Firebase (firebase_core/auth/firestore) is in the app - some
      # interaction between locally-bundled CanvasKit and Firebase's
      # Trusted Types policies breaks initialization. CanvasKit is loaded
      # from Google's CDN instead as a result.
      - run: flutter build web --release --base-href /ProConApp/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # Also publish into curatedcontent/catalogentry-hub's gh-pages branch
      # under /ProConApp/, so www.catalogentry.com/ProConApp/ stays in sync.
      # keep_files preserves the hub's own content and other projects.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.HUB_DEPLOY_TOKEN }}
          external_repository: curatedcontent/catalogentry-hub
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: ProConApp
          keep_files: true
          user_name: vintage
          user_email: email@catalogentry.com

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
